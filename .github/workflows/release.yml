name: Release Voice Assistant

on:
  push:
    tags: ['**']

permissions:
  contents: read

concurrency:
  group: voice-assistant-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Test, package and publish addon
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: python -m pip install pytest paramiko

      - name: Test addon
        run: python -m pytest -q

      - name: Validate tag, package and verify addon
        id: package
        env:
          PYTHONPATH: ${{ github.workspace }}
        shell: python
        run: |
          import os
          import xml.etree.ElementTree as ET
          from zipfile import ZipFile
          from build_package import ROOT, build

          manifest = ET.parse(ROOT / 'addon.xml').getroot()
          addon_id, version = manifest.get('id'), manifest.get('version')
          tag = os.environ['GITHUB_REF_NAME']
          if tag not in (version, f'v{version}'):
              raise SystemExit(f'Tag {tag} does not match addon.xml version {version}')

          package = build()
          with ZipFile(package) as archive:
              if archive.testzip() is not None:
                  raise SystemExit('Invalid ZIP archive')
              prefix = f'{addon_id}/'
              names = archive.namelist()
              if not names or not all(name.startswith(prefix) for name in names):
                  raise SystemExit('Incorrect addon directory in ZIP')
              required = ('addon.xml', 'default.py', 'service.py', 'LICENSE.txt',
                          'README.md', 'command.md', 'resources/settings.xml')
              for name in required:
                  if prefix + name not in names:
                      raise SystemExit(f'Missing addon file: {name}')
              packaged = ET.fromstring(archive.read(prefix + 'addon.xml'))
              if packaged.get('id') != addon_id or packaged.get('version') != version:
                  raise SystemExit('Packaged manifest does not match release')
              for asset in packaged.findall("extension[@point='xbmc.addon.metadata']/assets/*"):
                  if prefix + (asset.text or '').strip() not in names:
                      raise SystemExit(f'Missing packaged asset: {asset.text}')

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'path={package.as_posix()}\n')

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          PACKAGE_PATH: ${{ steps.package.outputs.path }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$PACKAGE_PATH" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$RELEASE_TAG" --draft=false --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" "$PACKAGE_PATH" \
              --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "$RELEASE_TAG"
          fi
